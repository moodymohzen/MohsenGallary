<!DOCTYPE html>

<meta charset="UTF-8">
<title>معرض ذكرياتي</title>

<style>
  body {
    margin: 0;
    font-family: "Tahoma", sans-serif;
    background: #fff5f7;
  }

  .gallery-container {
    padding: 40px;
    text-align: center;
  }

  .title {
    font-size: 2.2rem;
    color: #c0392b;
    margin-bottom: 25px;
  }

  /* شبكة الصور المرنة */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 0 20px;
  }

  /* كارد الصورة */
  .photo-card {
    background: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
  }

  .photo-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  /* الصورة نفسها */
  .photo-card img {
     width: 100%;
  height: 250px; /* ارتفاع ثابت لكل الصور */
  object-fit: cover; /* يخلي القص احترافي */
  border-bottom: 0;
  }

  /* الكابشن */
  .caption {
    padding: 12px;
    color: #555;
    font-size: 0.95rem;
    text-align: center;
  }

  /* زر الرجوع */
  .back-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 10px 25px;
    background: #c0392b;
    color: #fff;
    border-radius: 25px;
    text-decoration: none;
    transition: 0.3s;
  }

  .back-btn:hover {
    background: #e74c3c;
  }

/* زر الموسيقى العائم */
#music-toggle {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #c0392b;
  color: #fff;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 50px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
  animation: floatBtn 3s ease-in-out infinite;
  z-index: 999;

  #music-toggle {
  width: 70px;      /* كان 55 */
  height: 70px;     /* كان 55 */
  font-size: 30px;  /* كان 24 */
}
}

#music-toggle:hover {
  transform: scale(1.15);
  background: #e74c3c;
}

/* حركة لطيفة للزر */
@keyframes floatBtn {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}


</style>

<script>
  const music = document.getElementById("bg-music");
  const toggleBtn = document.getElementById("music-toggle");

  let isPlaying = true;

  toggleBtn.addEventListener("click", () => {
    if (isPlaying) {
      music.pause();
      toggleBtn.textContent = "🔈"; // رمز إيقاف
    } else {
      music.play();
      toggleBtn.textContent = "🔊"; // رمز تشغيل
    }
    isPlaying = !isPlaying;
  });

  // حل مشكلة المتصفحات اللي تمنع التشغيل التلقائي
  window.addEventListener("click", () => {
    if (music.paused) {
      music.play();
    }
  });
</script>
