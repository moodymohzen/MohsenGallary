<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ذكريات أحمد & أميرة</title>
<style>
  body {
    margin: 0;
    font-family: "Tahoma", sans-serif;
    overflow: hidden;
    background: #ffdde1;
  }

  /* خلفية القلوب */
  .hearts {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: -1;
  }

  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(255, 0, 102, 0.7);
    transform: rotate(45deg);
    animation: floatUp 6s linear infinite;
    border-radius: 5px;
  }

  .heart:before,
  .heart:after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: rgba(255, 0, 102, 0.7);
    border-radius: 50%;
  }

  .heart:before {
    top: -10px;
    left: 0;
  }

  .heart:after {
    left: 10px;
    top: 0;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(45deg); opacity: 1; }
    100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
  }

  /* صفحة البداية */
  .intro {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #c0392b;
    padding: 20px;
    animation: fadeIn 1.5s ease;
  }

  .intro h1 {
    font-size: 2.8rem;
    margin-bottom: 10px;
  }

  .intro p {
    font-size: 1.3rem;
    max-width: 600px;
    line-height: 1.9;
    margin-bottom: 30px;
  }

  .btn {
    background: #c0392b;
    color: #fff;
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 1.2rem;
    cursor: pointer;
    border: none;
    transition: 0.3s;
  }

  .btn:hover {
    background: #e74c3c;
    transform: scale(1.05);
  }

  /* انتقال */
  .fade-out {
    animation: fadeOut 1s forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: scale(1.05); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<!-- خلفية القلوب -->
<div class="hearts">
  <!-- توليد قلوب كثيرة -->
  <script>
    for (let i = 0; i < 40; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = Math.random() * 100 + "vh";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";
      heart.style.opacity = Math.random();
      document.querySelector(".hearts").appendChild(heart);
    }
  </script>
</div>

<!-- صفحة البداية -->
<div class="intro" id="intro">
  <h1>أحلى ذكريات أحمد & أميرة</h1>
  <p>إلي أجمل وأحلي من رأت عيني حبيبتي وأغلي ما أملك إليك ألبوم يجمع أجمل لحظات مررت بها في حياتي
  </p>
  <button class="btn" onclick="openGallery()">فتح الذكريات</button>
</div>

<script>
  function openGallery() {
    const intro = document.getElementById("intro");
    intro.classList.add("fade-out");

    setTimeout(() => {
      window.location.href = "gallery.html"; // افتح صفحة المعرض
    }, 900);
  }
</script>

</body>
</html>
